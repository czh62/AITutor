services:
  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      HOST: "0.0.0.0"
      PORT: "9621"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      LIGHTRAG_BASE_URL: "http://lightrag:9621"
    depends_on:
      - lightrag

  ui:
    container_name: aitutory-ui
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    command: npm run dev -- --host 0.0.0.0 --port 5174
    environment:
      VITE_BACKEND_PROXY_TARGET: "http://backend:8000"
    depends_on:
      - backend
